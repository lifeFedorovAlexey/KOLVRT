name: Dependency hygiene
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Pinned cargo-deny cache
        id: deny-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5 (Node 24)
        with:
          path: |
            target/ci-tools/cargo-deny/bin/
            target/cache-integrity.json
          key: cargo-deny-v1-${{ runner.os }}-1.99.0-0.19.9-${{ hashFiles('scripts/cache-integrity.cjs', '.github/workflows/dependencies.yml') }}
      - name: Verify cached audit tool bytes
        if: steps.deny-cache.outputs.cache-hit == 'true'
        run: node scripts/cache-integrity.cjs verify target/cache-integrity.json
      - name: Install pinned host audit tool
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.19.9 --root target/ci-tools/cargo-deny
      - name: Verify version and record tool cache
        run: |
          test "$(target/ci-tools/cargo-deny/bin/cargo-deny --version)" = "cargo-deny 0.19.9"
          echo "$GITHUB_WORKSPACE/target/ci-tools/cargo-deny/bin" >> "$GITHUB_PATH"
          node scripts/cache-integrity.cjs record target/cache-integrity.json
      - name: Boundary rejection controls
        run: node --test scripts/tests/dependency-audit.test.cjs
      - name: Inventory and supply chain
        id: inventory
        run: node scripts/dependency-audit.cjs check --supply-chain
      - name: Compare actual PR base
        if: ${{ always() && github.event_name == 'pull_request' && steps.inventory.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/dependency-base" "$BASE_SHA"
          node scripts/dependency-base.cjs "$RUNNER_TEMP/dependency-base" "$RUNNER_TEMP/dependency-base-inventory"
          node scripts/dependency-audit.cjs diff "$RUNNER_TEMP/dependency-base-inventory/inventory.json" target/dependencies/inventory.json target/dependencies/pr-diff.md
      - name: Publish dependency diff in PR check summary
        if: always()
        run: |
          if [ -f target/dependencies/report.md ]; then cat target/dependencies/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f target/dependencies/pr-diff.md ]; then cat target/dependencies/pr-diff.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f target/dependencies/diff.md ]; then cat target/dependencies/diff.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: dependency-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/dependencies/
          retention-days: 90
