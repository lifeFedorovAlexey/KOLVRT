name: Kernel foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pinned compiler
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add --toolchain 1.99.0 aarch64-unknown-none
          exit $LASTEXITCODE
      - name: Pinned emulator
        shell: pwsh
        run: ./scripts/setup-qemu.ps1
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Architecture lint
        run: cargo clippy --locked -p kolvrt-kernel --target aarch64-unknown-none --features diagnostics,kernel-tests -- -D warnings
      - name: Production architecture lint
        run: cargo clippy --locked -p kolvrt-kernel --target aarch64-unknown-none --release --no-default-features -- -D warnings
      - name: Real kernel matrix and host failure propagation
        run: cargo xtask test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-evidence
          path: target/kernel/
