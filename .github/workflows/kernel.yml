name: Kernel foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pinned compiler
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add --toolchain 1.99.0 aarch64-unknown-none
          exit $LASTEXITCODE
      - name: Pinned emulator
        shell: pwsh
        run: ./scripts/setup-qemu.ps1
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Exception registry rejection fixtures
        run: cargo test --locked -p repository-checks exceptions::tests
      - name: Routing model contracts
        run: cargo test --locked -p routing --all-features
      - name: Production model and absent switching
        run: cargo test --locked -p routing --no-default-features
      - name: Architecture lint
        run: cargo clippy --locked -p kolvrt-kernel --target aarch64-unknown-none --features diagnostics,kernel-tests -- -D warnings
      - name: Production architecture lint
        run: cargo clippy --locked -p kolvrt-kernel --target aarch64-unknown-none --release --no-default-features -- -D warnings
      - name: Real kernel matrix and host failure propagation
        run: cargo xtask test
      - name: Real EL0 routing matrix and failure propagation
        run: cargo xtask routing test
      - name: Real 16-bit ASID baseline comparison
        shell: pwsh
        env:
          QEMU_CPU: max
        run: |
          cargo xtask asid-bench
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asidReceipt = Get-Content research/results/issue18-asid-measurements.json -Raw | ConvertFrom-Json
          foreach ($asidPair in $asidReceipt.pairs) {
            if ($asidPair.results.tagged.hardware_asid_bits -ne 16 -or $asidPair.results.baseline.hardware_asid_bits -ne 16) {
              throw 'Expected actual 16-bit ASID hardware profile'
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-evidence
          path: |
            target/kernel/
            research/results/issue18-asid-measurements.json
