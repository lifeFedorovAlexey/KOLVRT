name: Kernel foundation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "baseline preserves the old serial checks; optimized enables the new graph"
        type: choice
        options: [baseline, optimized]
        default: optimized
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    if: ${{ inputs.mode == 'baseline' }}
    uses: ./.github/workflows/ci-windows-workload.yml
    with:
      workload: baseline
      cached: false
  static:
    if: ${{ inputs.mode != 'baseline' }}
    uses: ./.github/workflows/ci-windows-workload.yml
    with:
      workload: static
      cached: true
  host:
    needs: static
    uses: ./.github/workflows/ci-windows-workload.yml
    with:
      workload: host
      cached: true
  kernel-dev:
    needs: static
    if: needs.static.outputs.kernel_required == 'true'
    uses: ./.github/workflows/ci-windows-workload.yml
    with:
      workload: kernel-dev
      cached: true
  kernel-prod:
    needs: static
    if: needs.static.outputs.kernel_required == 'true'
    uses: ./.github/workflows/ci-windows-workload.yml
    with:
      workload: kernel-prod
      cached: true
  matrix:
    needs: static
    if: needs.static.outputs.kernel_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    uses: ./.github/workflows/ci-windows-workload.yml
    with:
      workload: matrix
      shard: ${{ matrix.shard }}
      cached: true
  routing:
    needs: static
    if: needs.static.outputs.kernel_required == 'true'
    uses: ./.github/workflows/ci-windows-workload.yml
    with:
      workload: routing
      cached: true
  asid:
    needs: static
    if: needs.static.outputs.kernel_required == 'true'
    uses: ./.github/workflows/ci-windows-workload.yml
    with:
      workload: asid
      cached: true
  evidence:
    needs: matrix
    uses: ./.github/workflows/ci-windows-workload.yml
    with:
      workload: evidence
      cached: true
  foundation:
    if: always()
    needs:
      [
        baseline,
        static,
        host,
        kernel-dev,
        kernel-prod,
        matrix,
        routing,
        asid,
        evidence,
      ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require every mandatory workload
        env:
          RESULTS: ${{ toJSON(needs) }}
          KERNEL_REQUIRED: ${{ needs.static.outputs.kernel_required }}
          MODE: ${{ inputs.mode != 'baseline' }}
        run: node scripts/ci-gate.cjs
