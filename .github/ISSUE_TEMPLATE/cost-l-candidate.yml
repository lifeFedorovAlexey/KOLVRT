name: COST-L Candidate
description: Propose a recurring compatibility-debt reason; IDs require reviewed allocation.
title: "[COST-L Candidate] "
body:
  - type: markdown
    attributes:
      value: >-
        This issue will be public. Do not paste unrestricted inventories or logs. Review and
        sanitize the exact text and attachments locally before submitting. UNKNOWN with a reason is
        useful evidence. Submission does not establish support or authorize a hardware survey. See
        the [submission
        guide](https://github.com/lifeFedorovAlexey/KOLVRT/blob/main/docs/research/issue-submissions.md),
        [research program](https://github.com/lifeFedorovAlexey/KOLVRT/issues/44) and [COST-L
        registry](https://github.com/lifeFedorovAlexey/KOLVRT/blob/main/research/cost-l/registry.json).
        You may answer in English or Russian.
  - type: textarea
    id: cost-l
    attributes:
      label: COST-L references
      description: >-
        Existing stable IDs use COST-L-#### (four digits; COST-L-0000 is reserved) and link to the
        registry. For an unallocated candidate, use candidate plus an issue link; never invent an
        assigned ID. Use UNKNOWN with a reason if unresolved.
    validations:
      required: true
  - type: textarea
    id: recurrence
    attributes:
      label: Recurring incompatibility
      description: >-
        Describe the concrete semantics and affected subsystem. Provide recurrence evidence across
        consumers/driver families or explain why recurrence is still unknown; API names alone are
        insufficient.
    validations:
      required: true
  - type: dropdown
    id: classification
    attributes:
      label: Proposed origin classification
      options:
        - UNKNOWN - requires historical research
        - HISTORICAL_CONSTRAINT
        - COMPATIBILITY_REQUIREMENT
        - HARDWARE_REQUIREMENT
        - PERFORMANCE_TRADEOFF
        - BUG
        - DESIGN_FLAW
        - ACCIDENTAL_SEMANTICS
        - SECURITY_WORKAROUND
        - OTHER
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary evidence
      description: >-
        Public upstream links pinned to a commit/version, exact file/section/line locators,
        configuration and evidence gaps. UNKNOWN with a reason is acceptable.
    validations:
      required: true
  - type: textarea
    id: history
    attributes:
      label: History and uncertainty
      description: >-
        Origin, original rationale and versions with primary evidence, or UNKNOWN plus research
        questions. Do not infer a historical cause solely from current code.
    validations:
      required: true
  - type: textarea
    id: native
    attributes:
      label: Native difference
      description: >-
        Accepted native decision/reference or proposed difference/open question. Explain the
        required behavior and why mediation may be necessary.
    validations:
      required: true
  - type: textarea
    id: consumers
    attributes:
      label: Candidate consumers and cost
      description: >-
        Name real or candidate consumers and module versions, distinguish proposals from supported
        artifacts. Cost dimensions are UNKNOWN unless measured with denominator, scope and
        provenance; UNKNOWN is not zero.
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Security and authority constraints
      description: >-
        State native-authorized effects, isolation and rejection requirements. Compatibility cannot
        grant missing rights. Separate hardware constraints from compatibility debt; list unknowns.
    validations:
      required: true
  - type: textarea
    id: exit
    attributes:
      label: Migration, removal and evidence gaps
      description: >-
        Proposed owner/support window or UNKNOWN; native migration alternative, removal
        dependencies, tests and missing evidence. This form does not allocate a stable ID.
    validations:
      required: true
  - type: checkboxes
    id: public-review
    attributes:
      label: Public submission review
      options:
        - label: >-
            I reviewed every field and any attachment locally and removed secrets, serials,
            MAC/IP/SSID, usernames, hostnames and private paths. I approve publication of exactly
            this reviewed content.
          required: true
        - label: >-
            I distinguish proposals and UNKNOWN values from executed evidence; this submission does
            not authorize further inventory collection or publication.
          required: true
