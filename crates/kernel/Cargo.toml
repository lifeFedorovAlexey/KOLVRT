[package]
name = "kolvrt-kernel"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "kolvrt-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
kernel-core = { path = "../kernel-core" }

[features]
default = []
diagnostics = []
machine-events = []
ipc-benchmark = ["machine-events"]
boot-payload = []
native-apps = ["machine-events"]
kernel-tests = []
ipc-storage-scope-input = ["kernel-tests"]
ipc-duplicate-ready-input = ["kernel-tests"]
ipc-wrong-process-wake-input = ["kernel-tests"]
ipc-blocked-reclaim-input = ["kernel-tests"]
ipc-teardown-input = ["kernel-tests"]
scheduler-inner-lock-input = ["kernel-tests"]
scheduler-lock-input = ["kernel-tests"]
scheduler-task-input = ["kernel-tests"]
scheduler-owner-input = ["kernel-tests"]
supervision-commit-negative = ["kernel-tests"]
supervision-dependency-negative = ["kernel-tests"]
negative-test = ["kernel-tests"]
panic-test = ["kernel-tests"]
ownership-test = ["kernel-tests"]
retained-mapping-test = ["kernel-tests"]
secondary-panic-test = ["kernel-tests"]
retirement-negative = ["kernel-tests"]
asid-baseline = []
