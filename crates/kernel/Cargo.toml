[package]
name = "kolvrt-kernel"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "kolvrt-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
kernel-core = { path = "../kernel-core" }

[features]
default = []
diagnostics = []
machine-events = []
boot-payload = []
kernel-tests = []
negative-test = ["kernel-tests"]
panic-test = ["kernel-tests"]
ownership-test = ["kernel-tests"]
retained-mapping-test = ["kernel-tests"]
secondary-panic-test = ["kernel-tests"]
retirement-negative = ["kernel-tests"]
shootdown-negative = ["kernel-tests"]
remote-tlbi-negative = ["kernel-tests"]
user-context-negative = ["kernel-tests"]
user-root-negative = ["kernel-tests"]
user-retirement-negative = ["kernel-tests"]
asid-baseline = []
asid-reuse-negative = ["kernel-tests"]
scheduler-contract-negative = ["kernel-tests"]
scheduler-foreign-negative = ["scheduler-contract-negative"]
scheduler-reentry-negative = ["scheduler-contract-negative"]
scheduler-stale-negative = ["scheduler-contract-negative"]
scheduler-reset-negative = ["scheduler-contract-negative"]
scheduler-inspect-negative = ["scheduler-contract-negative"]
scheduler-complete-negative = ["scheduler-contract-negative"]
scheduler-irq-negative = ["scheduler-contract-negative"]
scheduler-lock-negative = ["scheduler-contract-negative"]
scheduler-start-negative = ["scheduler-contract-negative"]
scheduler-task-negative = ["scheduler-contract-negative"]
scheduler-owner-negative = ["scheduler-contract-negative"]
scheduler-inner-lock-negative = ["scheduler-contract-negative"]
scheduler-context-negative = ["scheduler-contract-negative"]
scheduler-aarch32-negative = ["scheduler-context-negative"]
scheduler-user-irq-negative = ["scheduler-context-negative"]
process-contract-negative = ["kernel-tests"]
process-unlink-negative = ["process-contract-negative"]
process-start-negative = ["process-contract-negative"]
process-stale-negative = ["process-contract-negative"]
process-reclaim-negative = ["process-contract-negative"]
process-exit-negative = ["process-contract-negative"]
process-rollback-negative = ["process-contract-negative"]
