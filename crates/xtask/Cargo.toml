[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.0"
kernel-core = { path = "../kernel-core" }
routing = { path = "../routing", optional = true, default-features = false, features = ["dev", "compat-v1", "compat-v2", "bug-compat"] }

[features]
default = []
route-tools = ["dep:routing"]

