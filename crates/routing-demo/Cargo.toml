[package]
name = "routing-demo"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "routing-demo"
path = "src/main.rs"
test = false
bench = false
required-features = ["guest"]

[dependencies]
kernel-core = { path = "../kernel-core" }
routing = { path = "../routing", default-features = false }

[build-dependencies]
routing = { path = "../routing", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }

[features]
default = []
guest = []
evidence = ["routing/conformance"]
profile-negative = ["evidence"]
adapter-negative = ["evidence"]
report-negative = ["evidence"]
dev = ["routing/dev", "evidence"]
v1 = ["routing/compat-v1"]
v2 = ["routing/compat-v2"]
bug = ["routing/bug-compat"]
