[package]
name = "migration-workbench"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "migration-workbench"

[dependencies]
host-process-metrics = { path = "../host-process-metrics" }
migration-advisor = { path = "../migration-advisor" }
kernel-core = { path = "../kernel-core" }
routing = { path = "../routing", features = ["dev", "conformance", "compat-v1", "compat-v2", "bug-compat"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
ed25519-dalek = "=3.0.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
quanta = { version = "=0.13.0", default-features = false }
