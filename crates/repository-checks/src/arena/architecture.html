<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>KOLVRT · Architecture</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1220;
        --panel: #152337;
        --ink: #eff6ff;
        --muted: #a7bdd5;
        --line: #344c68;
        --accent: #62e1c9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.45 system-ui,
          sans-serif;
      }
      button,
      a {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: var(--ink);
        background: #17273d;
        border: 1px solid #3a506c;
        border-radius: 9px;
        padding: 8px 12px;
      }
      button:hover,
      button:focus-visible {
        border-color: var(--accent);
        outline: 2px solid #62e1c955;
      }
      a {
        color: #9bd5ff;
        overflow-wrap: anywhere;
      }
      header {
        position: fixed;
        z-index: 3;
        left: 20px;
        right: 20px;
        top: 16px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        pointer-events: none;
      }
      header > div {
        pointer-events: auto;
        display: flex;
        gap: 7px;
        align-items: center;
        background: #0b1220eb;
        border: 1px solid #2d425e;
        border-radius: 13px;
        padding: 6px;
      }
      .brand {
        padding: 0 9px;
        font-weight: 750;
        letter-spacing: 0.03em;
      }
      .brand small {
        display: block;
        font-size: 10px;
        font-weight: 400;
        color: var(--muted);
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: grab;
      }
      #canvas.dragging {
        cursor: grabbing;
      }
      .node {
        cursor: pointer;
        outline: none;
      }
      .node .card {
        fill: #152337;
        stroke: #3a5574;
        stroke-width: 1.4;
      }
      .node:hover .card,
      .node:focus .card {
        stroke: #9bd5ff;
        stroke-width: 2.4;
      }
      .node.active .card {
        fill: #143a3f;
        stroke: #62e1c9;
        stroke-width: 2.4;
      }
      .node text {
        pointer-events: none;
        fill: var(--ink);
      }
      .node .name {
        font-size: 18px;
        font-weight: 650;
      }
      .node .stats {
        font-size: 13px;
        fill: #aec7df;
      }
      .node .perf {
        font-size: 12px;
        fill: #b9cce0;
      }
      .node .measured {
        fill: #78e8d1;
      }
      .icon {
        stroke: #b9d6ef;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .edge {
        fill: none;
        stroke-width: 1.6;
        opacity: 0.52;
        pointer-events: stroke;
        cursor: pointer;
      }
      .edge.active {
        stroke-width: 2.6;
        opacity: 1;
      }
      .edge.muted {
        opacity: 0.2;
      }
      .layerbox {
        fill: #0e1929;
        stroke: #243954;
        stroke-width: 1.5;
        rx: 18;
      }
      .layerlabel {
        fill: #819fbd;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 1px;
      }
      .popup {
        position: fixed;
        z-index: 5;
        width: 370px;
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 110px);
        overscroll-behavior: contain;
        overflow: auto;
        padding: 18px;
        border: 1px solid #567591;
        border-radius: 14px;
        background: #142236fa;
        box-shadow: 0 16px 60px #0009;
        backdrop-filter: blur(14px);
      }
      .popup.tooltip {
        width: 260px;
        max-width: calc(100vw - 24px);
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 12px;
      }
      .popup.tooltip p {
        margin: 3px 0;
      }
      .popup.tooltip .relation-heading {
        color: var(--muted);
        font-size: 11px;
      }
      .popup[hidden] {
        display: none;
      }
      .popup h2 {
        font-size: 20px;
        margin: 0 30px 6px 0;
      }
      .popup p {
        margin: 8px 0;
      }
      .popup .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .popup .close {
        position: absolute;
        right: 9px;
        top: 9px;
        padding: 3px 9px;
      }
      .popup h3 {
        font-size: 12px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: #a7c3de;
        margin: 16px 0 6px;
      }
      .popup details {
        padding: 5px 0;
        border-bottom: 1px solid #2a4059;
      }
      .popup summary {
        cursor: pointer;
      }
      .popup a {
        font-size: 11px;
        display: block;
        margin: 4px 0;
      }
      .popup .values {
        color: var(--accent);
        font-size: 17px;
        font-weight: 650;
      }
      .relation {
        padding: 7px 0;
        border-bottom: 1px solid #2a4059;
        cursor: pointer;
      }
      .relation:hover {
        color: var(--accent);
      }
      footer {
        position: fixed;
        bottom: 12px;
        left: 20px;
        right: 20px;
        pointer-events: none;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: #9fb6cf;
        font-size: 11px;
      }
      footer span {
        background: #0b1220e8;
        padding: 5px 8px;
        border-radius: 7px;
      }
      .legend-dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 7px;
      }
      @media (max-width: 700px) {
        header {
          left: 8px;
          right: 8px;
          top: 8px;
        }
        .brand {
          font-size: 12px;
        }
        .brand small {
          max-width: 140px;
        }
        button {
          padding: 7px 9px;
        }
        footer {
          left: 8px;
          right: 8px;
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <button id="back" hidden></button
        ><button id="detail-data" hidden></button
        ><span class="brand">KOLVRT<small id="subtitle"></small></span>
      </div>
      <div>
        <button id="minus" aria-label="Zoom out">−</button
        ><button id="plus" aria-label="Zoom in">+</button

    <section

      class="popup"
      hidden
      tabindex="-1"
      role="dialog"

    <footer><span id="hint"></span><span id="provenance"></span></footer>

            });
          card.append(
            se("rect", { width: DW, height: DH, rx: 12, class: "card" }),
            se("path", {
              d: icons[shortId(n)],
              transform: "translate(14 14)",
              class: "icon",
            }),
          );
          const name = se("g", {
            tabindex: 0,
            role: "note",
            "aria-label": memberName(m),
            style: "pointer-events:all",
          });
          wrapName(memberName(m)).forEach((line, j) =>
            name.append(
              se(
                "text",
                {
                  x: 47,
                  y: 28 + j * 18,
                  class: "name",
                  style: "font-size:13px;pointer-events:all",
                },
                line,
              ),
            ),
          );
          name.addEventListener("pointerenter", () => {
            clearTimeout(hoverTimer);
            if (!pinned)
              hoverTimer = setTimeout(() => showMember(m, i, false), 150);
          });
          name.addEventListener("pointerleave", scheduleClose);
          name.addEventListener("focus", () => {
            if (!pinned) showMember(m, i, false);
          });
          card.append(name);
          m.sources.forEach((file, j) => {
            const a = se("a", {
              href:
                model.view.repository_href +
                file.split("/").map(encodeURIComponent).join("/"),
              target: "_blank",
              rel: "noopener",
              "aria-label": file,
            });
            a.append(
              se(
                "text",
                {
                  x: 14,
                  y: sourceY + j * 14,
                  fill: "#9bd5ff",
                  style:
                    "font-size:11px;pointer-events:all;text-decoration:underline",
                },
                file.split("/").slice(-2).join("/") + " ↗",
              ),
            );
            card.append(a);
          });
          const metricStatus = se(
            "text",
            {
              x: 14,
              y: DH - 12,
              class: "perf",
              tabindex: 0,
              style: "pointer-events:all",
              "aria-label": t("pending"),
            },
            language === "ru" ? "Замеры: —" : "Metrics: —",
          );
          const explainMetrics = () => {
            if (pinned) return;
            popupKind = null;
            popupBase(t("pending"), false);
            popup.append(element("p", t("pending")));
            const rect = metricStatus.getBoundingClientRect();
            positionPopup(rect.right, rect.bottom);
          };
          metricStatus.addEventListener("pointerenter", explainMetrics);
          metricStatus.addEventListener("focus", explainMetrics);
          metricStatus.addEventListener("pointerleave", scheduleClose);
          metricStatus.addEventListener("blur", scheduleClose);
          card.append(metricStatus);
          scene.append(card);
          nodeEls.set(m.id, card);
        });
        for (const boundary of boundaryNodes) {
          const [x, y] = locations.get(boundary.id),
            card = se("g", {
              transform: `translate(${x} ${y})`,
              class: "node boundary",
              tabindex: 0,
              role: "button",
              "aria-label": title(boundary.group),
            });
          card.append(
            se("rect", {
              width: DW,
              height: 76,
              rx: 12,
              fill: "#0e1b2b",
              stroke: "#708aa6",
              "stroke-width": 1.5,
              "stroke-dasharray": "5 3",
            }),
            se("path", {
              d: icons[shortId(boundary.group)],
              transform: "translate(14 14)",
              class: "icon",
            }),
            se(
              "text",
              { x: 47, y: 33, class: "name", style: "font-size:14px" },
              title(boundary.group) + " ↗",
            ),
            se(
              "text",
              { x: 14, y: 60, class: "stats" },
              language === "ru" ? "Внешний компонент" : "External component",
            ),
          );
          card.addEventListener("click", () => enterDetail(boundary.group));
          card.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              enterDetail(boundary.group);
            }
          });
          scene.append(card);
          nodeEls.set(boundary.id, card);
        }
        scene.append(captionLayer);
        window.arenaGeometry = {
          node: n.id,
          language,
          cardBoxes,
          labelBoxes: captionBoxes,
          annotationBoxes: separatorBoxes,
          incidentRootIndices: incident.map((item) => item.index),
          boundaryBranches: relations
            .filter((relation) => relation.root_index !== undefined)
            .map((relation) => ({
              root_index: relation.root_index,
              from: relation.from,
              to: relation.to,
              external_member: relation.external_member,
              member_pair: relation.member_pair,
            })),
        };
        updateUI();
      }
      function showLabel(n, label) {
        popupKind = null;
        popupBase(title(n), false);
        popup.append(
          element(
            "p",
            language === "ru"
              ? translations.nodes[n.id].ruResponsibility
              : n.responsibility,
          ),
        );
        const rect = label.getBoundingClientRect();
        positionPopup(rect.right, rect.bottom);
      }
      function popupBase(heading, pin) {
        clearTimeout(hoverTimer);
        pinned = pin;
        popup.replaceChildren();
        popup.hidden = false;
        popup.classList.toggle("tooltip", !pin);
        popup.setAttribute("role", pin ? "dialog" : "tooltip");
        popup.setAttribute("aria-label", heading);
        if (pin) {
          const close = element("button", "×", "close");
          close.setAttribute("aria-label", t("close"));
          close.onclick = closePopup;
          popup.append(close, element("h2", heading));
        }
      }
      function positionPopup(x, y) {
        popup.style.maxHeight =
          Math.max(
            120,
            Math.min(pinned ? innerHeight - 110 : 240, innerHeight - 110),
          ) + "px";
        const w = popup.offsetWidth,
          h = popup.offsetHeight;
        popup.style.left =
          Math.max(12, Math.min(innerWidth - w - 12, x + 16)) + "px";
        popup.style.top =
          Math.max(76, Math.min(innerHeight - h - 16, y)) + "px";
      }
      function showData(n) {
        popupKind = { node: n.id };
        popupBase(
          (language === "ru" ? "Данные · " : "Data · ") + title(n),
          true,
        );
        popup.append(
          element("p", t("historical")),
          element("p", t("repeat"), "muted"),
        );
        for (const profile of ["DEV", "PROD"]) {
          const runs = n.measurements.filter(
              (r) => r.execution_profile === profile,
            ),
            metrics = runs.map((r) => r.metrics[0]);
          if (!runs.length) {
            popup.append(element("p", profile + ": " + t("noData")));
            continue;
          }
          const converted = metrics.every(
            (m) => typeof m.microseconds === "number",
          );
          popup.append(
            element(
              "p",
              profile +
                " " +
                metrics
                  .map((m) =>
                    Number(converted ? m.microseconds : m.value).toFixed(3),
                  )
                  .join(" / ") +
                " " +
                (converted ? t("us") : t("ticks")),
              "values",
            ),
            element(
              "p",
              "N=" +
                metrics.map((m) => m.sample_count).join(" / ") +
                " · QEMU · " +
                runs[0].exact_commit.slice(0, 12),
              "muted",
            ),
          );
          for (const run of runs) popup.append(link(run.path));
        }
        popup.append(element("p", t("scope"), "muted"));
        const rect = (
          detailNode
            ? document.getElementById("detail-data")
            : nodeEls.get(n.id)
        ).getBoundingClientRect();
        positionPopup(rect.right, rect.top);
      }
      function routeDescription(e, heading, pin) {
        popupBase(heading, pin);
        if (!pin) popup.append(element("p", heading, "relation-heading"));
        popup.append(element("p", edgeText(e)));
        if (pin) for (const file of e.evidence) popup.append(link(file));
      }
      function showEdge(e, x, y, pin) {
        popupKind = { edge: model.edges.indexOf(e) };
        const heading =
          title(nodes.get(e.from)) + " → " + title(nodes.get(e.to));
        routeDescription(e, heading, pin);
        positionPopup(x, y);
      }
      function closePopup() {
        clearTimeout(hoverTimer);
        popup.hidden = true;
        pinned = false;
        popupKind = null;
        selected = null;
        highlight(null);
      }
      function scheduleClose() {
        clearTimeout(hoverTimer);
        if (!pinned) hoverTimer = setTimeout(closePopup, 260);
      }
      popup.addEventListener("wheel", (e) => e.stopPropagation(), {
        passive: true,
      });
      popup.addEventListener(
        "toggle",
        () => {
          if (!popup.hidden)
            positionPopup(
              parseFloat(popup.style.left) - 16,
              parseFloat(popup.style.top),
            );
        },
        true,
      );
      popup.addEventListener("pointerenter", () => clearTimeout(hoverTimer));
      popup.addEventListener("pointerleave", scheduleClose);
      popup.addEventListener("click", () => {
        if (!popup.hidden) pinned = true;
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closePopup();
      });
      function help() {
        popupKind = { help: true };
        popupBase(t("help"), true);
        for (const [k, c] of Object.entries(colors)) {
          const row = element("p"),
            dot = element("span", undefined, "legend-dot");
          dot.style.background = c;
          row.append(dot, document.createTextNode(t(k)));
          popup.append(row);
        }
        popup.append(
          element("p", t("helpline")),
          element("p", t("helpnav")),
          element("p", t("topology"), "muted"),
          element("p", t("notmeasured"), "muted"),
        );
        for (const w of model.view.measurement_warnings)
          popup.append(
            element(
              "p",
              t("unavailable") + ": " + w.path + " — " + w.reason,
              "muted",
            ),
          );
        popup.append(
          link(model.view.canonical_document),
          element(
            "p",
            t("snapshot") + ": " + model.view.snapshot_sha256,
            "muted",
          ),
        );
        positionPopup(innerWidth - 400, 75);
      }
      function updateUI() {
        document.documentElement.lang = language;
        document.title = "KOLVRT · " + t("subtitle");
        document.getElementById("subtitle").textContent =
          `${t("subtitle")} · ${model.view.el1_groups} EL1 + ${model.view.el0_groups} EL0 · ${model.edges.length} ${t("edges")}`;
        document.getElementById("fit").textContent = t("fit");
        document.getElementById("lang").textContent =
          language === "ru" ? "EN" : "RU";
        document.getElementById("hint").textContent = detailNode
          ? language === "ru"
            ? "Цветные стрелки — подтверждённые взаимодействия. Замеры механизмов не реализованы."
            : "Colored arrows: reviewed interactions. Mechanism measurements not implemented."
          : t("hint");
        document.getElementById("back").hidden = !detailNode;
        document.getElementById("detail-data").hidden = !(
          detailNode && detailNode.measurements.length
        );
        document.getElementById("detail-data").textContent =
          language === "ru" ? "Данные" : "Data";
        document.getElementById("back").textContent =
          language === "ru" ? "← Ядро" : "← Kernel";
        if (detailNode)
          document.getElementById("subtitle").textContent =
            title(detailNode) +
            " · " +
            detailNode.members.length +
            " " +
            t("members") +
            " · " +
            t("ins") +
            ":" +
            model.edges.filter((e) => e.to === detailNode.id).length +
            " / " +
            t("outs") +
            ":" +
            model.edges.filter((e) => e.from === detailNode.id).length;
        document.getElementById("provenance").textContent =
          t("source") +
          " " +
          model.view.source_commit.slice(0, 12) +
          (model.view.worktree_dirty ? " + " + t("dirty") : "");
        document.getElementById("help").title = t("help");
        document.getElementById("help").setAttribute("aria-label", t("help"));
        document
          .getElementById("plus")
          .setAttribute(
            "aria-label",
            language === "ru" ? "Увеличить" : "Zoom in",
          );
        document
          .getElementById("minus")
          .setAttribute(
            "aria-label",
            language === "ru" ? "Уменьшить" : "Zoom out",
          );
        svg.setAttribute("aria-label", t("subtitle"));
        if (popup.hidden)
          popup.setAttribute(
            "aria-label",
            language === "ru" ? "Подробности компонента" : "Component details",
          );
      }
      document.getElementById("detail-data").onclick = () =>
        showData(detailNode);
      document.getElementById("back").onclick = () => {
        closePopup();
        detailNode = null;
        draw();
        fit();
      };
      document.getElementById("plus").onclick = () => zoom(1.25);
      document.getElementById("minus").onclick = () => zoom(0.8);
      document.getElementById("fit").onclick = () => {
        closePopup();
        fit();
      };
      document.getElementById("help").onclick = help;
      document.getElementById("lang").onclick = () => {
        const old = popupKind,
          pin = pinned;
        language = language === "ru" ? "en" : "ru";
        draw();
        if (old?.member !== undefined && detailNode)
          showMember(detailNode.members[old.member], old.member, pin);
        else if (old?.node) showData(nodes.get(old.node));
        else if (old?.edge !== undefined)
          showEdge(model.edges[old.edge], innerWidth - 400, 80, pin);
        else if (old?.help) help();
      };
      window.addEventListener("resize", () => {
        closePopup();
        fit();
      });
      draw();
      fit();
    </script>
  </body>
</html>
